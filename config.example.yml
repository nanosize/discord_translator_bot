channel_mappings: []
# Example:
# channel_mappings:
#   - source_channel_id: 123456789012345678
#     target_channel_id: 234567890123456789
# IDs may refer to regular channels or forum channels. Messages in a source
# forum's posts are translated; a forum target creates one translated post per
# source message.
excluded_channel_ids: []
# Channels where all bot translation features are disabled. Excluding a forum
# also excludes all of its posts/threads.
# Example:
# excluded_channel_ids:
#   - 345678901234567890
# The /reaction-translate command can disable reactions for individual channels.
# Its settings are saved here automatically. A forum ID applies to its threads.
reaction_translation_disabled_channel_ids: []
flag_map: {}
# Example:
# flag_map:
#   "🇯🇵": "JA"
#   "🇺🇸": "EN"
max_per_minute: 30
